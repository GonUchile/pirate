# Servidor pirate optimizado en memoria para 64 beams (2026-10-21): pool de RAM ajustado a lo que se usa (antes 150 GiB).
# La RAM sobrante de host_memory_per_server (tras la dedispersión) se usa como ring buffer de frames.
num_servers: 1
server_cpus: [ 0 ]
host_memory_per_server: '64 GiB'   # 20 GiB historia del árbol + ~44 GiB de ring buffer (32 chunks x 64 beams x 22,7 MB)
gpu_memory_per_server: '15 GiB'   # la dedispersión usa 14,4 GiB (gmem 15,5 GB)
use_hugepages: false
ringbuf_nchunks: 32   # 65,5 s: cubre la latencia de DM 1000 (~33 s) con margen
data_ip_addrs:
  - '127.0.0.1:5000'
rpc_ip_addrs:
  - '127.0.0.1:6000'
grouper_ip_addrs:
  - '127.0.0.1:7000'
min_data_mtu: 1500
min_rpc_mtu: 1500
ssd_dirs: [ '/dev/shm/pirate_ssd' ]
ssd_threads_per_server: 1
nfs_dir: 'volcados'   # relativo a donde se lanza pirate
nfs_threads_per_server: 1
check_mountpoints: [ ]
