# Servidor pirate en esta máquina (1 CPU, 1 RTX 4090, loopback).
# La RAM sobrante de host_memory_per_server (tras la dedispersión) se usa como ring buffer de frames.
num_servers: 1
server_cpus: [ 0 ]
host_memory_per_server: '150 GiB'
gpu_memory_per_server: '17 GiB'
use_hugepages: false
ringbuf_nchunks: 64
data_ip_addrs:
  - '127.0.0.1:5000'
rpc_ip_addrs:
  - '127.0.0.1:6000'
grouper_ip_addrs:
  - '127.0.0.1:7000'
min_data_mtu: 1500
min_rpc_mtu: 1500
ssd_dirs: [ '/dev/shm/pirate_ssd' ]
ssd_threads_per_server: 1
nfs_dir: 'volcados'   # relativo a donde se lanza pirate
nfs_threads_per_server: 1
check_mountpoints: [ ]
